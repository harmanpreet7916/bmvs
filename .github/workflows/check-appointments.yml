name: Check BMVS Appointments

on:
  schedule:
    # Run every 5 minutes — script itself checks if it's 6-8 AM ACST
    - cron: "*/5 * * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Quick time check (skip if outside 6-8 AM ACST)
        id: timecheck
        run: |
          python3 << 'PYEOF'
          from datetime import datetime, timezone, timedelta
          import os
          try:
              import zoneinfo
              acst = zoneinfo.ZoneInfo('Australia/Darwin')
          except Exception:
              acst = timezone(timedelta(hours=9, minutes=30))
          now = datetime.now(acst)
          hour = now.strftime('%H')
          minute = now.strftime('%M')
          if 6 <= now.hour < 8:
              print('Darwin time: ' + hour + ':' + minute + ' ACST - in window')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('in_window=true\n')
          else:
              print('Darwin time: ' + hour + ':' + minute + ' ACST - outside window, skipping')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('in_window=false\n')
          PYEOF

      - name: Cache Playwright browsers
        if: steps.timecheck.outputs.in_window == 'true'
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}

      - name: Install dependencies
        if: steps.timecheck.outputs.in_window == 'true'
        run: pip install -r requirements.txt

      - name: Install Chromium (if not cached)
        if: steps.timecheck.outputs.in_window == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Check for available appointments
        if: steps.timecheck.outputs.in_window == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
        run: python checker.py

      - name: Upload state on failure
        if: failure() && steps.timecheck.outputs.in_window == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-state
          path: state/
          retention-days: 7
